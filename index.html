<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParticleImage Library Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #007AFF;
            --bg: #ffffff;
            --text: #121212;
            --glass: rgba(255, 255, 255, 0.7);
            --border: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .canvas-container {
            width: 500px;
            height: 500px;
            position: relative;
            background: var(--bg);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            padding: 12px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        button,
        .upload-label {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid transparent;
            cursor: pointer;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        button:hover,
        .upload-label:hover {
            background: rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }

        button:active,
        .upload-label:active {
            transform: translateY(0);
        }

        #btn-scatter {
            background: var(--text);
            color: var(--bg);
        }

        #btn-scatter:hover {
            opacity: 0.9;
        }

        .upload-label {
            background: var(--primary);
            color: white;
        }

        .upload-label:hover {
            background: #0066D6;
            color: white;
        }

        #file-upload {
            display: none;
        }

        .title {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
        }

        .title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .title p {
            margin: 4px 0 0;
            font-size: 14px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="canvas-container">
        <div class="title">
            <h1>ParticleImage</h1>
            <p>Interactive 3D Particle Aggregation</p>
        </div>

        <canvas id="particle-canvas"></canvas>

        <div class="controls">
            <button id="btn-leaf">Leaf</button>
            <button id="btn-beethoven">Beethoven</button>
            <label for="file-upload" class="upload-label">
                Upload Image
            </label>
            <input type="file" id="file-upload" accept="image/*">
            <button id="btn-scatter">Scatter</button>
        </div>
    </div>

    <script type="module">
        import { ParticleImage } from './src/ParticleImage.js';

        const canvas = document.getElementById('particle-canvas');
        const effect = new ParticleImage(canvas, {
            theme: 'light',
            particlesScale: 0.6,
            density: 200
        });

        // Preload images to ensure fast rendering on first click
        effect.preload([
            './demo_image/leaf.png',
            './demo_image/beethoven.png'
        ]);

        document.getElementById('btn-leaf').onclick = () => effect.render('./demo_image/leaf.png');
        document.getElementById('btn-beethoven').onclick = () => effect.render('./demo_image/beethoven.png');
        document.getElementById('btn-scatter').onclick = () => effect.scatter();

        const fileUpload = document.getElementById('file-upload');
        fileUpload.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                effect.render(event.target.result);
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>

</html>
